# Build app-top and publish it to Cloudflare Pages.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   an API token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account ID that owns the Pages project
#
# Neither value ever appears in this file, in the build output, or in the logs.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never run two deploys of the same branch at once; the newer one wins.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `make install` and `make build` are the same commands a developer runs
      # locally, so CI cannot silently drift from the local build. The Makefile
      # owns the templateDocs prebuild. Nothing here needs a NODE_OPTIONS flag or
      # a CI= override: Vite builds identically whether or not CI is set, and the
      # single Node version above (from .nvmrc) serves the build and wrangler alike.
      - name: Install dependencies
        run: make install

      - name: Build
        run: make build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The project name and output directory come from wrangler.toml.
          command: pages deploy --branch=${{ github.ref_name }}
